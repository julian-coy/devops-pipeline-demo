<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Pipeline Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }
    .badge.dev  { background: #1a9e75; }
    .badge.prod { background: #ba7517; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: #8b949e; margin-bottom: 0.3rem; }
    .stack {
      margin-top: 2rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tag {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge ${environment}">${upper(environment)}</span>
    <h1>DevOps Pipeline Demo</h1>
    <p>Desplegado con GitHub Actions + Terraform</p>
    <p>Infraestructura en AWS — EC2 t2.micro + Nginx</p>
    <div class="stack">
      <span class="tag">GitHub Actions</span>
      <span class="tag">Terraform</span>
      <span class="tag">AWS EC2</span>
      <span class="tag">Nginx</span>
      <span class="tag">Zero Trust</span>
    </div>
  </div>
</body>
</html>
